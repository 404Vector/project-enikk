# project-enikk 런타임 설정
# 우선순위: 코드 기본값 < 이 파일 < 환경변수(ENIKK_<SECTION>__<KEY>) < CLI 옵션
# 경로는 이 파일이 있는 디렉토리 기준 상대경로.

[image]
repository = "enikk/claude-agent"
tag = "0.1.0"
context = "deploy/docker/claude-agent"

[cluster]
context = "docker-desktop"
namespace = "enikk"

[release]
name = "enikk-agent"
chart = "deploy/helm/enikk-agent"
# values.local.yaml 이 존재하면 자동으로 추가됨 (git 제외 대상)
values_files = []

[credentials]
secret_name = "enikk-anthropic"
secret_key = "ANTHROPIC_API_KEY"
