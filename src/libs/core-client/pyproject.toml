[project]
name = "enikk-core-client"
version = "0.1.0"
description = "Typed enikk-core API client that attaches the caller's projected ServiceAccount token"
requires-python = ">=3.12"
dependencies = [
    "enikk-kernel",
    "enikk-contracts",
    "httpx>=0.28",
]

[tool.uv.sources]
enikk-kernel = { workspace = true }
enikk-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enikk_core_client"]
