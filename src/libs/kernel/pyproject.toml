[project]
name = "enikk-kernel"
version = "0.1.0"
description = "Foundation: errors, base models, settings base, logging, process execution"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enikk_kernel"]
