[project]
name = "enikk-k8s-jobs"
version = "0.1.0"
description = "Kubernetes API readers for core: Argo CD Applications (ADR-0023) and Pod logs (ADR-0029)"
requires-python = ">=3.12"
dependencies = [
    "enikk-kernel",
    "enikk-core-domain",
    "httpx>=0.28",
    "pyyaml>=6.0.2",
]

[tool.uv.sources]
enikk-kernel = { workspace = true }
enikk-core-domain = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enikk_k8s_jobs"]
