[project]
name = "enikk-platform"
version = "0.1.0"
description = "Docker, Helm and kubectl adapters for the ops CLI"
requires-python = ">=3.12"
dependencies = ["enikk-kernel"]

[tool.uv.sources]
enikk-kernel = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enikk_platform"]
