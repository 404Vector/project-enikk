[project]
name = "enikk-github"
version = "0.1.0"
description = "GitHub App adapter: signs app JWTs and issues narrowly scoped installation tokens"
requires-python = ">=3.12"
dependencies = [
    "enikk-kernel",
    "enikk-core-domain",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
]

[tool.uv.sources]
enikk-kernel = { workspace = true }
enikk-core-domain = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enikk_github"]
