[project]
name = "enikk-contracts"
version = "0.1.0"
description = "Shared pydantic contracts between enikk-core and its clients"
requires-python = ">=3.12"
dependencies = ["enikk-kernel"]

[tool.uv.sources]
enikk-kernel = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enikk_contracts"]
