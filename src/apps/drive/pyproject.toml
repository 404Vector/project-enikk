[project]
name = "enikk-drive"
version = "0.1.0"
description = "enikk-drive: file exchange through a Google Drive folder as MCP tools (ADR-0053)"
requires-python = ">=3.12"
dependencies = [
    "enikk-kernel",
    "enikk-contracts",
    "enikk-core-client",
    "cryptography>=44",
    "httpx>=0.28",
    "mcp>=2.3",
    "starlette>=0.40",
    "uvicorn>=0.32",
]

[project.scripts]
enikk-drive = "enikk_drive.main:main"

[tool.uv.sources]
enikk-kernel = { workspace = true }
enikk-contracts = { workspace = true }
enikk-core-client = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enikk_drive"]
