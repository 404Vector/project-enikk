[project]
name = "enikk-ops"
version = "0.1.0"
description = "enikk ops CLI: cluster bootstrap and local development tools"
requires-python = ">=3.12"
dependencies = [
    "enikk-kernel",
    "enikk-contracts",
    "enikk-core-client",
    "enikk-platform",
    "httpx>=0.28",
    "typer>=0.15",
    "pyyaml>=6.0.2",
]

[project.scripts]
enikk-ops = "enikk_ops.cli:main"

[tool.uv.sources]
enikk-kernel = { workspace = true }
enikk-contracts = { workspace = true }
enikk-core-client = { workspace = true }
enikk-platform = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enikk_ops"]
