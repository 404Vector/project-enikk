[project]
name = "enikk-core"
version = "0.1.0"
description = "enikk-core: control-plane API service"
requires-python = ">=3.12"
dependencies = [
    "enikk-kernel",
    "enikk-contracts",
    "enikk-core-domain",
    "enikk-persistence-sql",
    "enikk-k8s-auth",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "typer>=0.15",
    "pyyaml>=6.0.2",
]

[project.scripts]
enikk-core = "enikk_core.main:main"

[tool.uv.sources]
enikk-kernel = { workspace = true }
enikk-contracts = { workspace = true }
enikk-core-domain = { workspace = true }
enikk-persistence-sql = { workspace = true }
enikk-k8s-auth = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enikk_core"]
