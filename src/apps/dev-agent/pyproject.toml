[project]
name = "enikk-dev-agent"
version = "0.1.0"
description = "Isolated dev agent: runs one task in a fresh workspace and opens a pull request (ADR-0021)"
requires-python = ">=3.12"
dependencies = [
    "enikk-kernel",
    "enikk-contracts",
    "enikk-core-client",
    "enikk-runtime",
    "enikk-langfuse",
    "enikk-engine-claude",
    "pyyaml>=6.0.2",
]

[project.scripts]
enikk-dev-agent = "enikk_dev_agent.main:main"

[tool.uv.sources]
enikk-kernel = { workspace = true }
enikk-contracts = { workspace = true }
enikk-core-client = { workspace = true }
enikk-runtime = { workspace = true }
enikk-langfuse = { workspace = true }
enikk-engine-claude = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enikk_dev_agent"]
