[project]
name = "enikk-unity"
version = "0.1.0"
description = "enikk-unity: relays the owner's Unity editor MCP server with its key (ADR-0044)"
requires-python = ">=3.12"
dependencies = [
    "enikk-kernel",
    "enikk-contracts",
    "enikk-core-client",
    "cryptography>=44",
    "httpx>=0.28",
    "mcp>=2.3",
    "starlette>=0.40",
    "uvicorn>=0.32",
]

[project.scripts]
enikk-unity = "enikk_unity.main:main"

[tool.uv.sources]
enikk-kernel = { workspace = true }
enikk-contracts = { workspace = true }
enikk-core-client = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enikk_unity"]
