# Slack ↔ agent routing, read by enikk-connector-slack (I-01, I-15, ADR-0018).
# Agent definitions know nothing about Slack; this file decides which agent answers.

# The only Slack member whose messages are handled. Everyone else is ignored.
owner: U04CF12EKRA

# Agent that starts a new conversation. Replies in an existing thread keep its agent.
routes:
  direct_message: enikk
  mention: enikk

# Channel for deployment, image build and rollback notices (ADR-0026). The bot must be
# a member. If posting there fails, the notice goes to the owner's DM instead.
# ENIKK_CONNECTOR_DEPLOY_NOTIFY_CHANNEL overrides it.
deploy_notify_channel: C0CKT1ZNZ43  # #release

# Approval channel: pull request approval requests and prompt promotion requests, with
# their buttons (ADR-0036). Only the owner's presses are acted on. The bot must be a
# member (a private channel needs /invite). If posting there fails, the request goes
# to the owner's DM instead. ENIKK_CONNECTOR_APPROVAL_CHANNEL overrides it.
approval_channel: C0CL7HZ5UQ1  # approval channel

# Custom emoji for the marks on the owner's messages (ADR-0042). Upload them to the
# workspace first. A mark that is not set, or not in the workspace, uses Slack's own
# emoji (hourglass, eyes, check mark, x, no entry, bookmark, pencil, wastebasket).
reactions:
  waiting: e-wait
  running: e-working
  replied: e-done
  failed: e-fail
  cancelled: e-cancel
  remembered: e-remember
  memory_updated: e-update
  forgotten: e-forget
