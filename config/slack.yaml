# Slack ↔ agent routing, read by enikk-connector-slack (I-01, I-15, ADR-0018).
# Agent definitions know nothing about Slack; this file decides which agent answers.

# The only Slack member whose messages are handled. Everyone else is ignored.
owner: U04CF12EKRA

# Agent that starts a new conversation. Replies in an existing thread keep its agent.
routes:
  direct_message: assistant
  mention: assistant

# Channel for deployment, image build and rollback notices (ADR-0026). The bot must be
# a member. If posting there fails, the notice goes to the owner's DM instead.
# ENIKK_CONNECTOR_DEPLOY_NOTIFY_CHANNEL overrides it.
deploy_notify_channel: C0CKT1ZNZ43  # #release
