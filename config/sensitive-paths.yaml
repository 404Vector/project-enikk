# Sensitive paths (ADR-0024, I-20). Any PR that changes one of these gets the
# stronger approval: a warning, the diff of these files first, and a confirmation
# dialog. Core judges with the list it is running with, so removing an entry is
# itself a sensitive change. A pattern ending in "/" covers everything below that
# directory; any other pattern is one file.
# Only the three boundaries of ADR-0041 §1 are listed: secrets, the owner's approval
# of merges and promotions, and GitOps-only changes to the cluster.
paths:
  - config/sensitive-paths.yaml
  - docs/architecture/invariants.md
  # CI, branch protection and which apps CI builds and publishes (ADR-0020, ADR-0040).
  - .github/
  - deploy/github/
  - deploy/images.yaml
  # Merge approval and prompt promotion (I-19, I-33, I-36).
  - src/apps/core/enikk_core/approval/
  - src/apps/core/enikk_core/prompts.py
  - src/libs/adapters/langfuse/enikk_langfuse/registry.py
  # Secrets: who gets which credential, and GitHub App tokens (I-07, I-30, I-32).
  - deploy/helm/core/
  - src/apps/core/enikk_core/credentials.py
  - config/github.yaml
  - src/libs/adapters/github/
  # What keeps the built-in tools away from the service's secrets, and their audit log (I-37).
  - src/libs/adapters/engine-claude/enikk_engine_claude/sandbox.py
  - src/libs/adapters/engine-claude/enikk_engine_claude/audit.py
  # The two secrets the sandboxed tools may read: the session's GitHub token and the
  # read-only Kubernetes token (ADR-0041 3a, 3c).
  - src/libs/adapters/engine-claude/enikk_engine_claude/github_access.py
  - src/libs/adapters/engine-claude/enikk_engine_claude/kube_access.py
  # Cluster permissions of every service (I-18, I-28).
  - deploy/k8s/identities/
  - deploy/helm/runtime-claude/templates/cluster-reader.yaml
