name: images

# Builds app images (ADR-0008). Pull requests only verify the Dockerfile and
# never receive a token that can write packages; commits on main publish.
# Every image is built for linux/amd64 and linux/arm64, each on a runner of its
# own architecture, and published as one multi-platform tag (ADR-0038). The arm64
# image is tagged first, alone, and the tag then grows to both (ADR-0048 §2).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "agents/**"
      - "config/**"
      - "deploy/docker/**"
      - "deploy/images.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".dockerignore"
      - ".github/workflows/images.yml"
  # Rebuild main by hand when a push was skipped (ADR-0028 §8): publish runs only
  # for main, so a dispatch on another ref builds nothing.
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "agents/**"
      - "config/**"
      - "deploy/docker/**"
      - "deploy/images.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".dockerignore"
      - ".github/workflows/images.yml"

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The apps to build come from deploy/images.yaml (ADR-0040).
  apps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: list
        run: |
          apps="$(yq -o=json -I=0 '.apps' deploy/images.yaml)"
          echo "${apps}" | jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and test("^[a-z][a-z0-9-]{0,40}$"))' > /dev/null
          echo "apps=${apps}" >> "${GITHUB_OUTPUT}"

  verify:
    if: github.event_name == 'pull_request'
    needs: apps
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.apps) }}
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/python-app.Dockerfile
          build-args: PACKAGE=enikk-${{ matrix.app }}
          platforms: linux/${{ matrix.platform.arch }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.platform.arch }}

  # Pushes each architecture's image by digest only; no tag exists until merge.
  build:
    needs: apps
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.apps) }}
        # The cluster's architecture is tagged as soon as it is built (ADR-0048 §2).
        platform:
          - { arch: amd64, runner: ubuntu-latest, early: false }
          - { arch: arm64, runner: ubuntu-24.04-arm, early: true }
    env:
      IMAGE: ghcr.io/404vector/enikk-${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/python-app.Dockerfile
          build-args: PACKAGE=enikk-${{ matrix.app }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=${{ matrix.app }}-${{ matrix.platform.arch }},mode=max

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.app }}--${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # Tags this architecture alone so the cluster need not wait for the other one;
      # publish later points the same tag at the index of both (ADR-0048 §2). A failure
      # here only loses the head start, so it does not fail the job.
      - name: Publish this architecture first
        if: matrix.platform.early
        continue-on-error: true
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE: https://github.com/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${SOURCE}" \
            --annotation "index:org.opencontainers.image.revision=${REVISION}" \
            --tag "${IMAGE}:sha-${REVISION}" \
            "${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE}:sha-${REVISION}"

  # Joins the architectures into the one tag Image Updater looks for. The early
  # architecture's manifest is already under it; this adds the other one.
  publish:
    needs: [apps, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.apps) }}
    env:
      IMAGE: ghcr.io/404vector/enikk-${{ matrix.app }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.app }}--*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform tag
        working-directory: ${{ runner.temp }}/digests
        env:
          SOURCE: https://github.com/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          test "$(ls | wc -l)" -eq 2
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${SOURCE}" \
            --annotation "index:org.opencontainers.image.revision=${REVISION}" \
            --tag "${IMAGE}:sha-${REVISION}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        env:
          REVISION: ${{ github.sha }}
        run: docker buildx imagetools inspect "${IMAGE}:sha-${REVISION}"
