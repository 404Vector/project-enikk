apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: enikk
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  writeBackConfig:
    method: argocd
  commonUpdateSettings:
    updateStrategy: newest-build
    allowTags: "regexp:^sha-[0-9a-f]{40}$"
  applicationRefs:
    - namePattern: enikk-core
      images:
        - alias: core
          imageName: ghcr.io/404vector/enikk-core
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
