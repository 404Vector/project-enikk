apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: enikk
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  writeBackConfig:
    method: argocd
  commonUpdateSettings:
    updateStrategy: newest-build
    allowTags: "regexp:^sha-[0-9a-f]{40}$"
    # Update even when the image is not yet running. Charts start with 0 replicas
    # until the first tag is set, so the image never appears as "in use" otherwise.
    forceUpdate: true
  applicationRefs:
    - namePattern: enikk-core
      images:
        - alias: core
          imageName: ghcr.io/404vector/enikk-core
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
    - namePattern: enikk-runtime-claude
      images:
        - alias: runtime-claude
          imageName: ghcr.io/404vector/enikk-runtime-claude
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
    - namePattern: enikk-connector-slack
      images:
        - alias: connector-slack
          imageName: ghcr.io/404vector/enikk-connector-slack
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
