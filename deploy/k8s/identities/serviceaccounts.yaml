# ServiceAccounts of the services that call enikk-core (ADR-0011 §5, ADR-0012 §7).
# Their tokens reach core only as audience=enikk-core projected tokens; none of them
# mounts a Kubernetes API token. Role mapping: deploy/helm/core/values.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enikk-connector-slack
  labels: { app.kubernetes.io/part-of: enikk }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enikk-runtime-claude
  labels: { app.kubernetes.io/part-of: enikk }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enikk-runtime-gemini
  labels: { app.kubernetes.io/part-of: enikk }
automountServiceAccountToken: false
---
# Identity of `enikk-ops smoke`: a connector of kind "smoke", so checks never
# compete with the Slack connector for outbox messages (ADR-0018).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enikk-smoke
  labels: { app.kubernetes.io/part-of: enikk }
automountServiceAccountToken: false
