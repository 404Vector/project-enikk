apiVersion: apps/v1
kind: Deployment
metadata:
  name: enikk-agentgateway
  labels:
    app.kubernetes.io/name: enikk-agentgateway
    app.kubernetes.io/part-of: enikk
spec:
  # Off switch (ADR-0039 "되돌리기"): 0. The engines' own switch is the runtime's
  # mcp.enabled.
  replicas: 1
  # A new Pod must be ready before the old one stops (ADR-0020 §3, ADR-0023 §3).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: enikk-agentgateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enikk-agentgateway
      annotations:
        # The gateway reads its configuration and core's public keys at start, and does
        # not start while core has no key (503). Bump this after changing configmap.yaml
        # or the GitHub App private key (the MCP signing key is derived from it) so the
        # gateway restarts and reads them.
        enikk.dev/revision: "3"
    spec:
      # No Kubernetes API token and no credentials: it holds no secret (I-09, I-28).
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agentgateway
          # Upstream v1.7.0 (2026-10-27), pinned by digest: an index with linux/amd64 and
          # linux/arm64. Not ours, so not in deploy/images.yaml or Image Updater (ADR-0040).
          image: ghcr.io/agentgateway/agentgateway:v1.7.0@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
          imagePullPolicy: IfNotPresent
          args: ["-f", "/etc/agentgateway/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
            - name: ready
              containerPort: 15021
          readinessProbe:
            httpGet: { path: /healthz/ready, port: ready }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz/ready, port: ready }
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/agentgateway
              readOnly: true
          # About 60Mi resident with one worker thread, measured locally.
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: enikk-agentgateway
