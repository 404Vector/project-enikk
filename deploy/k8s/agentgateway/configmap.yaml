# agentgateway's standalone configuration (ADR-0039 §2). One route per MCP server,
# /mcp/<server> → that server only. Per server: check core's token
# (mcpAuthentication), allow only the tools that are both in the ceiling and named by
# the token (mcpAuthorization; others are also left out of tools/list), and hand the
# session (ADR-0041 §3) and the issuing task and lease from the token to the server
# (transformations; any such headers from the caller are replaced). The token itself is
# not forwarded, except to the Unity relay and the Drive server, which check it again
# (ADR-0044 §5, ADR-0053 §4). The require rule is the gateway's ceiling of tools for
# the server. After a change, bump enikk.dev/revision in deployment.yaml so the gateway
# restarts with it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: enikk-agentgateway
  labels:
    app.kubernetes.io/name: enikk-agentgateway
    app.kubernetes.io/part-of: enikk
data:
  config.yaml: |
    config:
      adminAddr: "off"
      statsAddr: "off"
      readinessAddr: "0.0.0.0:15021"
      workerThreads: "1"
    binds:
      - port: 8080
        listeners:
          - routes:
              - name: scheduler
                matches:
                  - path: { pathPrefix: /mcp/scheduler }
                policies:
                  mcpAuthentication:
                    issuer: "enikk-core"
                    audiences: ["enikk-agentgateway"]
                    jwks: { url: "http://enikk-core.enikk.svc/v1/mcp/jwks" }
                    mode: strict
                    resourceMetadata: {}
                  mcpAuthorization:
                    # Ceiling for this server; a task gets only the tools its token names.
                    rules:
                      - require: 'mcp.tool.name in ["list_schedules", "get_schedule", "list_runs", "create_schedule", "update_schedule", "pause_schedule", "resume_schedule", "delete_schedule", "run_now"]'
                      - allow: '("scheduler:" + mcp.tool.name) in jwt.tools'
                  transformations:
                    request:
                      set:
                        x-enikk-session-id: jwt.session
                        x-enikk-task-id: jwt.task
                        x-enikk-lease-id: jwt.lease
                backends:
                  - mcp:
                      statefulMode: stateless
                      targets:
                        - name: scheduler
                          mcp: { host: "http://enikk-scheduler.enikk.svc/mcp" }
              - name: imagegen
                matches:
                  - path: { pathPrefix: /mcp/imagegen }
                policies:
                  mcpAuthentication:
                    issuer: "enikk-core"
                    audiences: ["enikk-agentgateway"]
                    jwks: { url: "http://enikk-core.enikk.svc/v1/mcp/jwks" }
                    mode: strict
                    resourceMetadata: {}
                  mcpAuthorization:
                    # Ceiling for this server; a task gets only the tools its token names.
                    rules:
                      - require: 'mcp.tool.name in ["generate_image", "edit_image", "list_styles", "add_style_reference", "remove_style_reference"]'
                      - allow: '("imagegen:" + mcp.tool.name) in jwt.tools'
                  transformations:
                    request:
                      set:
                        x-enikk-session-id: jwt.session
                        x-enikk-task-id: jwt.task
                        x-enikk-lease-id: jwt.lease
                backends:
                  - mcp:
                      statefulMode: stateless
                      targets:
                        - name: imagegen
                          mcp: { host: "http://enikk-imagegen.enikk.svc/mcp" }
              - name: unity
                matches:
                  - path: { pathPrefix: /mcp/unity }
                policies:
                  mcpAuthentication:
                    issuer: "enikk-core"
                    audiences: ["enikk-agentgateway"]
                    jwks: { url: "http://enikk-core.enikk.svc/v1/mcp/jwks" }
                    mode: strict
                    resourceMetadata: {}
                  mcpAuthorization:
                    # Ceiling for this server: every tool of MCP for Unity 10.3.0 and the
                    # relay's two resource tools (ADR-0044 §3). A task gets only the tools
                    # its token names.
                    rules:
                      - require: 'mcp.tool.name in ["apply_text_edits", "batch_execute", "blender_bridge", "create_script", "debug_request_context", "delete_script", "execute_code", "execute_menu_item", "find_gameobjects", "find_in_file", "generate_audio", "generate_image", "generate_model", "get_sha", "get_test_job", "import_model", "import_model_file", "manage_animation", "manage_asset", "manage_build", "manage_camera", "manage_components", "manage_editor", "manage_gameobject", "manage_graphics", "manage_material", "manage_packages", "manage_physics", "manage_prefabs", "manage_probuilder", "manage_profiler", "manage_scene", "manage_script", "manage_script_capabilities", "manage_scriptable_object", "manage_shader", "manage_texture", "manage_tools", "manage_ui", "manage_vfx", "read_console", "refresh_unity", "run_tests", "script_apply_edits", "set_active_instance", "unity_docs", "unity_reflect", "validate_script", "list_unity_resources", "read_unity_resource"]'
                      - allow: '("unity:" + mcp.tool.name) in jwt.tools'
                  transformations:
                    request:
                      set:
                        x-enikk-session-id: jwt.session
                        x-enikk-task-id: jwt.task
                        x-enikk-lease-id: jwt.lease
                        # The relay checks the token itself; its Service is reachable
                        # without the gateway (ADR-0044 §5).
                        x-enikk-mcp-token: jwt.rawToken.unredacted()
                backends:
                  - mcp:
                      statefulMode: stateless
                      targets:
                        - name: unity
                          mcp: { host: "http://enikk-unity.enikk.svc/mcp" }
              - name: drive
                matches:
                  - path: { pathPrefix: /mcp/drive }
                policies:
                  mcpAuthentication:
                    issuer: "enikk-core"
                    audiences: ["enikk-agentgateway"]
                    jwks: { url: "http://enikk-core.enikk.svc/v1/mcp/jwks" }
                    mode: strict
                    resourceMetadata: {}
                  mcpAuthorization:
                    # Ceiling for this server: the three exchange tools (ADR-0053 §2).
                    rules:
                      - require: 'mcp.tool.name in ["drive_put", "drive_get", "drive_list"]'
                      - allow: '("drive:" + mcp.tool.name) in jwt.tools'
                  transformations:
                    request:
                      set:
                        x-enikk-session-id: jwt.session
                        x-enikk-task-id: jwt.task
                        x-enikk-lease-id: jwt.lease
                        # The server checks the token itself and takes the session from
                        # it; its Service is reachable without the gateway (ADR-0053 §4).
                        x-enikk-mcp-token: jwt.rawToken.unredacted()
                backends:
                  - mcp:
                      statefulMode: stateless
                      targets:
                        - name: drive
                          mcp: { host: "http://enikk-drive.enikk.svc/mcp" }
