apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enikk-core
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/404Vector/project-enikk.git
    targetRevision: main
    path: deploy/helm/core
    # image.tag is set by Argo CD Image Updater as a helm parameter (ADR-0008).
  destination:
    server: https://kubernetes.default.svc
    namespace: enikk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
