apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identities
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/404Vector/project-enikk.git
    targetRevision: main
    path: deploy/k8s/identities
  destination:
    server: https://kubernetes.default.svc
    namespace: enikk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
