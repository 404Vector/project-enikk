apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enikk-connector-slack
  namespace: argocd
  annotations:
    # After enikk-core (wave 10), which hands the connector its Slack tokens.
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://github.com/404Vector/project-enikk.git
    targetRevision: main
    path: deploy/helm/connector-slack
    # image.tag is set by Argo CD Image Updater as a helm parameter (ADR-0008).
  destination:
    server: https://kubernetes.default.svc
    namespace: enikk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
