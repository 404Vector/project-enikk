apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/404Vector/project-enikk.git
    targetRevision: main
    path: deploy/k8s/database
  destination:
    server: https://kubernetes.default.svc
    namespace: enikk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # The Cluster CRD is installed by cnpg-operator; retry until it exists.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
