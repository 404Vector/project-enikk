# Off switch (ADR-0043 "되돌리기"): false runs no replicas.
enabled: true

image:
  repository: ghcr.io/404vector/enikk-imagegen
  # Set by Argo CD Image Updater. While empty, the Deployment runs no replicas.
  tag: ""
  pullPolicy: IfNotPresent

# The Gemini key and the Langfuse keys come from core (ADR-0013, I-09).
coreUrl: http://enikk-core.enikk.svc

# Lifetime of the audience=enikk-core projected token. kubelet rotates it.
coreTokenSeconds: 3600

langfuseUrl: https://jp.cloud.langfuse.com
tracing: true
defaultModel: gemini-3.1-flash-image
# Images per day (Asia/Seoul); 0 stops generation (ADR-0043 §2).
dailyLimit: 100

# The runtime's shared volume (ADR-0037 §7): images are saved to tmp/<session>/images
# and style references kept in styles/<style>. One node, so the ReadWriteOnce claim
# can be mounted here too.
workspace:
  claimName: enikk-runtime-claude-data
  mountPath: /data

resources:
  requests: { cpu: 20m, memory: 96Mi }
  limits: { memory: 320Mi }
