# Isolated dev agent (ADR-0021). This chart is a protected path (I-20).
namespace: enikk-dev

image:
  repository: ghcr.io/404vector/enikk-dev-agent
  # Set by Argo CD Image Updater. While empty, no Job template is published and
  # core starts no dev Jobs.
  tag: ""
  pullPolicy: IfNotPresent

# core runs in this namespace with this ServiceAccount; it alone may start Jobs here.
core:
  namespace: enikk
  serviceAccount: enikk-core

coreUrl: http://enikk-core.enikk.svc
langfuseUrl: https://jp.cloud.langfuse.com
coreTokenSeconds: 3600

job:
  # Hard stop: the agent definition's own limit plus time to clone, check and push.
  activeDeadlineSeconds: 4500
  ttlSecondsAfterFinished: 3600

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { memory: 3Gi }

workspace:
  sizeLimit: 4Gi
