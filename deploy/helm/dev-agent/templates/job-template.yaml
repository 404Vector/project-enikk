{{- if .Values.image.tag }}
# The Job core starts for one isolated task (ADR-0021). core substitutes ${TASK_ID}
# and nothing else; everything that matters for security is decided here, in git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: enikk-dev-agent-job
  namespace: {{ .Values.namespace }}
  labels: { app.kubernetes.io/part-of: enikk }
data:
  job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: enikk-dev-${TASK_ID}
      namespace: {{ .Values.namespace }}
      labels:
        app.kubernetes.io/name: enikk-dev-agent
        app.kubernetes.io/part-of: enikk
        enikk.dev/role: dev-agent
        enikk.dev/task: "${TASK_ID}"
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: enikk-dev-agent
            enikk.dev/role: dev-agent
            enikk.dev/task: "${TASK_ID}"
        spec:
          serviceAccountName: enikk-dev-agent
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dev-agent
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["enikk-dev-agent"]
              env:
                - name: ENIKK_DEV_TASK_ID
                  value: "${TASK_ID}"
                - name: ENIKK_DEV_CORE_URL
                  value: {{ .Values.coreUrl | quote }}
                - name: ENIKK_DEV_LANGFUSE_URL
                  value: {{ .Values.langfuseUrl | quote }}
                - name: ENIKK_DEV_WORKSPACE
                  value: /workspace
                - name: HOME
                  value: /tmp/home
              volumeMounts:
                - name: core-token
                  mountPath: /var/run/secrets/enikk/core
                  readOnly: true
                - name: workspace
                  mountPath: /workspace
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
          volumes:
            - name: core-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: enikk-core
                      expirationSeconds: {{ .Values.coreTokenSeconds }}
                      path: token
            - name: workspace
              emptyDir:
                sizeLimit: {{ .Values.workspace.sizeLimit }}
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
{{- end }}
