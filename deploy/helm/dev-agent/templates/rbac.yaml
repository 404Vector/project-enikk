# core's only Kubernetes rights besides TokenReview (I-28): manage dev agent Jobs
# in this namespace and read the Job template.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enikk-core-dev-jobs
  namespace: {{ .Values.namespace }}
  labels: { app.kubernetes.io/part-of: enikk }
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["enikk-dev-agent-job"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: enikk-core-dev-jobs
  namespace: {{ .Values.namespace }}
  labels: { app.kubernetes.io/part-of: enikk }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: enikk-core-dev-jobs
subjects:
  - kind: ServiceAccount
    name: {{ .Values.core.serviceAccount }}
    namespace: {{ .Values.core.namespace }}
