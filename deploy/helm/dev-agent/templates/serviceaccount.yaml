# The only ServiceAccount in this namespace besides "default", so a Job core starts
# can never run as another service (ADR-0021). Its token reaches core only as an
# audience=enikk-core projected token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enikk-dev-agent
  namespace: {{ .Values.namespace }}
  labels: { app.kubernetes.io/part-of: enikk }
automountServiceAccountToken: false
