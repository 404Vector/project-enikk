# Reached by agentgateway from S3 (ADR-0039 §2). Nothing calls it before then.
apiVersion: v1
kind: Service
metadata:
  name: enikk-scheduler
  labels:
    app.kubernetes.io/name: enikk-scheduler
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: enikk
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    app.kubernetes.io/name: enikk-scheduler
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
