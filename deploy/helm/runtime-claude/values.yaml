image:
  repository: ghcr.io/404vector/enikk-runtime-claude
  # Set by Argo CD Image Updater. While empty, the Deployment runs no replicas.
  tag: ""
  pullPolicy: IfNotPresent

replicas: 1

# Credentials (Claude token, Langfuse keys) come from enikk-core at startup
# (ADR-0013); this chart mounts no Secret.
coreUrl: http://enikk-core.enikk.svc
langfuseUrl: https://jp.cloud.langfuse.com

# Lifetime of the audience=enikk-core projected token. kubelet rotates it.
coreTokenSeconds: 3600

# The Claude Code CLI child process needs most of the memory (about 250MB per
# running task, Python about 100MB). Requests cover four slots; the limit leaves room
# for check tools (mypy, pytest) on top (ADR-0037 3a, changed 2026-11-26).
resources:
  requests: { cpu: 100m, memory: 1280Mi }
  limits: { memory: 2560Mi }

# Tasks leased and run at the same time (ADR-0037 3a). 1 goes back to one at a time.
worker:
  slots: 4

# Scratch space for the CLI's per-task config directory and its working directory.
scratch:
  sizeLimit: 1Gi

# Shared volume (ADR-0037 §7): base repository, snapshots of main, per-thread
# worktrees and tmp. Only things that can be made again live here; never secrets.
# The repository is public, so it is fetched without a token, on demand (no sidecar).
workspace:
  enabled: true
  mountPath: /data
  size: 5Gi
  # Empty: the cluster's default class. One node (ADR-0011, ADR-0013), so
  # ReadWriteOnce lets the old and new Pod share it during a rolling update.
  storageClass: ""
  accessMode: ReadWriteOnce
  repository: 404Vector/project-enikk
  remoteUrl: https://github.com/404Vector/project-enikk.git
  branch: main
  fetchIntervalSeconds: 60
  idleDays: 7
  minFreeMiB: 512

# Skills (ADR-0037 §2, §3): the list of skill-* prompts in Langfuse at the start of a
# shared role's session (with built-in tools), and the load_skill tool. false turns both off.
skills:
  enabled: true

# MCP tools through agentgateway (ADR-0039 §2, I-05): each server of a definition's
# tools.mcp at <gatewayUrl>/mcp/<server>, with core's token for the task. false is the
# off switch: no MCP server is attached.
mcp:
  enabled: true
  gatewayUrl: http://enikk-agentgateway.enikk.svc

# Read-only Kubernetes access from the shell (ADR-0041 3c): a ClusterRole that reads
# workloads, events, logs and Argo CD Applications but no Secrets, and a projected API
# token the engine copies into each run's home (enikk-kube, ~/.kube/config).
# false: no role, no token.
kube:
  enabled: true
  tokenSeconds: 3600

# Keep a thread's Claude process between its tasks (ADR-0041 §3): the next task of the
# thread goes to the same process instead of resuming from core's transcript. Closed
# after idleSeconds without a task, after maxAgeSeconds (at most 3600, the MCP token's
# extra lifetime), on a prompt change or a failed run, or to keep maxSessions.
# false: one process per task, as before.
live:
  enabled: true
  idleSeconds: 600
  maxAgeSeconds: 3600
  maxSessions: 4
