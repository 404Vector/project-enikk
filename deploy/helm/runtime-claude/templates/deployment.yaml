apiVersion: apps/v1
kind: Deployment
metadata:
  name: enikk-runtime-claude
  labels:
    app.kubernetes.io/name: enikk-runtime-claude
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: enikk
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  # No image has been published yet until Image Updater sets image.tag.
  replicas: {{ if .Values.image.tag }}{{ .Values.replicas }}{{ else }}0{{ end }}
  # A new Pod must be ready before the old one stops (ADR-0020 §3, ADR-0023 §3).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: enikk-runtime-claude
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enikk-runtime-claude
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: enikk-runtime-claude
      # The audience=enikk-core token, and the read-only API token of kube.enabled (I-28,
      # ADR-0041 3c); nothing mounted automatically.
      automountServiceAccountToken: false
      enableServiceLinks: false
      # A running task finishes or loses its lease; core re-queues it either way.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        # The shared volume can hold many files; only fix ownership when the root differs.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default "unset" }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["enikk-runtime-claude"]
          env:
            - name: ENIKK_RUNTIME_CORE_URL
              value: {{ .Values.coreUrl | quote }}
            - name: ENIKK_RUNTIME_LANGFUSE_URL
              value: {{ .Values.langfuseUrl | quote }}
            - name: ENIKK_RUNTIME_WORKDIR
              value: /work
            - name: ENIKK_RUNTIME_SCRATCH_DIR
              value: /tmp/enikk
            - name: ENIKK_RUNTIME_WORKER__SLOTS
              value: {{ .Values.worker.slots | quote }}
            - name: ENIKK_RUNTIME_SKILLS__ENABLED
              value: {{ .Values.skills.enabled | quote }}
            - name: ENIKK_RUNTIME_KUBE__ENABLED
              value: {{ .Values.kube.enabled | quote }}
            - name: ENIKK_RUNTIME_MCP__ENABLED
              value: {{ .Values.mcp.enabled | quote }}
            - name: ENIKK_RUNTIME_MCP__GATEWAY_URL
              value: {{ .Values.mcp.gatewayUrl | quote }}
            - name: ENIKK_RUNTIME_WORKSPACE__ENABLED
              value: {{ .Values.workspace.enabled | quote }}
            {{- if .Values.workspace.enabled }}
            - name: ENIKK_RUNTIME_WORKSPACE__ROOT
              value: {{ .Values.workspace.mountPath | quote }}
            - name: ENIKK_RUNTIME_WORKSPACE__REPOSITORY
              value: {{ .Values.workspace.repository | quote }}
            - name: ENIKK_RUNTIME_WORKSPACE__REMOTE_URL
              value: {{ .Values.workspace.remoteUrl | quote }}
            - name: ENIKK_RUNTIME_WORKSPACE__BRANCH
              value: {{ .Values.workspace.branch | quote }}
            - name: ENIKK_RUNTIME_WORKSPACE__FETCH_INTERVAL_SECONDS
              value: {{ .Values.workspace.fetchIntervalSeconds | quote }}
            - name: ENIKK_RUNTIME_WORKSPACE__IDLE_DAYS
              value: {{ .Values.workspace.idleDays | quote }}
            - name: ENIKK_RUNTIME_WORKSPACE__MIN_FREE_MIB
              value: {{ .Values.workspace.minFreeMiB | quote }}
            {{- end }}
          volumeMounts:
            - name: core-token
              mountPath: /var/run/secrets/enikk/core
              readOnly: true
            {{- if .Values.kube.enabled }}
            - name: kube-token
              mountPath: /var/run/secrets/enikk/kube
              readOnly: true
            {{- end }}
            - name: scratch
              mountPath: /tmp
            - name: work
              mountPath: /work
            {{- if .Values.workspace.enabled }}
            - name: data
              mountPath: {{ .Values.workspace.mountPath }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: core-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: enikk-core
                  expirationSeconds: {{ .Values.coreTokenSeconds }}
                  path: token
        {{- if .Values.kube.enabled }}
        # The API audience; read-only by the ClusterRole below (ADR-0041 3c).
        - name: kube-token
          projected:
            sources:
              - serviceAccountToken:
                  expirationSeconds: {{ .Values.kube.tokenSeconds }}
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        {{- end }}
        - name: scratch
          emptyDir:
            sizeLimit: {{ .Values.scratch.sizeLimit }}
        - name: work
          emptyDir:
            # One directory per running task (ADR-0037 3a).
            sizeLimit: 128Mi
        {{- if .Values.workspace.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: enikk-runtime-claude-data
        {{- end }}
