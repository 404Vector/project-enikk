apiVersion: apps/v1
kind: Deployment
metadata:
  name: enikk-core
  labels:
    {{- include "enikk-core.labels" . | nindent 4 }}
spec:
  # No image has been published yet until Image Updater sets image.tag.
  replicas: {{ if .Values.image.tag }}1{{ else }}0{{ end }}
  # A new Pod must be ready before the old one stops (ADR-0020 §3, ADR-0023 §3).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "enikk-core.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "enikk-core.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: enikk-core
      # core's Kubernetes API token: TokenReview, dev agent Jobs in enikk-dev and
      # reading the Argo CD Applications it reports on (I-28).
      automountServiceAccountToken: true
      # Service links inject ENIKK_CORE_PORT=tcp://... and collide with settings.
      enableServiceLinks: false
      securityContext:
        {{- include "enikk-core.podSecurityContext" . | nindent 8 }}
      containers:
        - name: core
          image: {{ include "enikk-core.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["enikk-core", "serve"]
          env:
            - name: ENIKK_CORE_PORT
              value: {{ .Values.port | quote }}
            - name: ENIKK_CORE_VERSION
              value: {{ .Values.image.tag | default "unset" | quote }}
            - name: ENIKK_CORE_AGENTS_DIR
              value: /app/agents
            - name: ENIKK_CORE_ROLE_BINDINGS
              value: {{ .Values.roleBindings | toJson | quote }}
            - name: ENIKK_CORE_CREDENTIALS_DIR
              value: {{ .Values.credentials.mountPath | quote }}
            - name: ENIKK_CORE_GITHUB__APP_ID
              value: {{ .Values.github.appId | quote }}
            - name: ENIKK_CORE_GITHUB__INSTALLATION_ID
              value: {{ .Values.github.installationId | quote }}
            - name: ENIKK_CORE_GITHUB__OWNER
              value: {{ .Values.github.owner | quote }}
            - name: ENIKK_CORE_GITHUB__SELF_REPOSITORY
              value: {{ .Values.github.selfRepository | quote }}
            - name: ENIKK_CORE_GITHUB__REPOSITORIES_FILE
              value: /app/config/github.yaml
            - name: ENIKK_CORE_APPROVAL__ENABLED
              value: {{ .Values.approval.enabled | quote }}
            - name: ENIKK_CORE_APPROVAL__INTERVAL_SECONDS
              value: {{ .Values.approval.intervalSeconds | quote }}
            - name: ENIKK_CORE_DEPLOYMENTS__ENABLED
              value: {{ .Values.deployments.enabled | quote }}
            - name: ENIKK_CORE_DEPLOYMENTS__INTERVAL_SECONDS
              value: {{ .Values.deployments.intervalSeconds | quote }}
            - name: ENIKK_CORE_DEPLOYMENTS__ARGOCD_NAMESPACE
              value: {{ .Values.deployments.argocdNamespace | quote }}
            - name: ENIKK_CORE_DEPLOYMENTS__APPS
              value: {{ .Values.deployments.apps | toJson | quote }}
            - name: ENIKK_CORE_DEPLOYMENTS__TIMEOUT_SECONDS
              value: {{ .Values.deployments.timeoutSeconds | quote }}
            - name: ENIKK_CORE_DEPLOYMENTS__SETTLE_SECONDS
              value: {{ .Values.deployments.settleSeconds | quote }}
            - name: ENIKK_CORE_DEV_AGENT__ENABLED
              value: {{ .Values.devAgent.enabled | quote }}
            - name: ENIKK_CORE_DEV_AGENT__NAMESPACE
              value: {{ .Values.devAgent.namespace | quote }}
            - name: ENIKK_CORE_DEV_AGENT__MAX_CONCURRENT
              value: {{ .Values.devAgent.maxConcurrent | quote }}
            - name: ENIKK_CORE_DEV_AGENT__DAILY_LIMIT
              value: {{ .Values.devAgent.dailyLimit | quote }}
            {{- include "enikk-core.databaseEnv" . | nindent 12 }}
          volumeMounts:
            - name: credentials
              mountPath: {{ .Values.credentials.mountPath }}
              readOnly: true
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "enikk-core.containerSecurityContext" . | nindent 12 }}
      volumes:
        - name: credentials
          secret:
            secretName: {{ .Values.credentials.secret }}
            optional: true
            defaultMode: 0440
