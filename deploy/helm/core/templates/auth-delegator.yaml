# core verifies caller tokens with TokenReview and has no other Kubernetes API permission (I-28).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: enikk-core-auth-delegator
  labels:
    {{- include "enikk-core.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: enikk-core
    namespace: {{ .Release.Namespace }}
