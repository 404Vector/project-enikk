{{- if .Values.diagnostics.enabled }}
# core reads, never changes, the Pods and recent logs of enikk's own services
# for read-only diagnostics (ADR-0029, I-28).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enikk-core-log-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "enikk-core.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: enikk-core-log-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "enikk-core.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: enikk-core-log-reader
subjects:
  - kind: ServiceAccount
    name: enikk-core
    namespace: {{ .Release.Namespace }}
{{- end }}
