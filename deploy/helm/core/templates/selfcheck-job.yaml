{{- if .Values.image.tag }}
# Checks the deployed core after every sync (ADR-0023 §2). If it fails, the
# sync fails and core's deployment watcher reports the failure to the owner.
apiVersion: batch/v1
kind: Job
metadata:
  name: enikk-core-selfcheck
  labels:
    {{- include "enikk-core.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .Values.selfcheck.deadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enikk-core-selfcheck
    spec:
      restartPolicy: Never
      # The smoke identity: a connector of kind "smoke" (deploy/k8s/identities).
      serviceAccountName: enikk-smoke
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "enikk-core.podSecurityContext" . | nindent 8 }}
      containers:
        - name: selfcheck
          image: {{ include "enikk-core.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["enikk-core", "selfcheck"]
          env:
            - name: ENIKK_SELFCHECK_CORE_URL
              value: "http://enikk-core.{{ .Release.Namespace }}.svc"
            - name: ENIKK_SELFCHECK_EXPECTED_VERSION
              value: {{ .Values.image.tag | quote }}
          volumeMounts:
            - name: core-token
              mountPath: /var/run/secrets/enikk/core
              readOnly: true
          resources:
            {{- toYaml .Values.selfcheck.resources | nindent 12 }}
          securityContext:
            {{- include "enikk-core.containerSecurityContext" . | nindent 12 }}
      volumes:
        - name: core-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: enikk-core
                  expirationSeconds: 600
                  path: token
{{- end }}
