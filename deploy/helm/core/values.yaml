image:
  repository: ghcr.io/404vector/enikk-core
  # Set by Argo CD Image Updater. While empty, the Deployment runs no replicas.
  tag: ""
  pullPolicy: IfNotPresent

port: 8000

# CloudNativePG application Secret (ADR-0011). Created by the operator, never by hand.
database:
  secret: enikk-db-app

# Credentials core hands out (ADR-0013). Written only by `enikk-ops secret sync`
# and mounted into core alone. Optional, so core starts before the first sync.
credentials:
  secret: enikk-core-credentials
  mountPath: /var/run/secrets/enikk/credentials

# GitHub App (ADR-0019). Public identifiers; the private key is the core-only
# credential github.app-private-key. selfRepository pins which entry of
# config/github.yaml is the platform itself (workflows off, protected paths).
github:
  # Strings: Helm renders large numbers in exponent form.
  appId: "5869950"
  installationId: "184545127"
  owner: 404Vector
  selfRepository: project-enikk

# Isolated dev agent Jobs (ADR-0021). The Role that lets core start them is in
# deploy/helm/dev-agent; core waits until that chart publishes the Job template.
# Slack approval of pull requests (ADR-0020): core watches open PRs to main and
# asks the owner in a DM; approving records enikk/owner-approval and merges.
approval:
  enabled: true
  intervalSeconds: 30

devAgent:
  enabled: true
  namespace: enikk-dev
  maxConcurrent: 1
  dailyLimit: 10

# ServiceAccounts allowed to call core, their roles (ADR-0011 §5) and the
# credentials each may fetch (ADR-0013). Any other ServiceAccount is rejected.
# Accounts live in deploy/k8s/identities.
roleBindings:
  - namespace: enikk
    service_account: enikk-connector-slack
    role: connector
    connector: slack
    credentials: [slack.bot-token, slack.app-token]
  - namespace: enikk
    service_account: enikk-runtime-claude
    role: runtime
    engine: claude
    credentials: [claude.oauth-token, langfuse.public-key, langfuse.secret-key]
  - namespace: enikk
    service_account: enikk-runtime-gemini
    role: runtime
    engine: gemini
  - namespace: enikk-dev
    service_account: enikk-dev-agent
    role: dev-agent
    # Its GitHub token comes from /v1/github/token, scoped per task (ADR-0019, I-32).
    credentials: [claude.oauth-token, langfuse.public-key, langfuse.secret-key]
  - namespace: enikk
    service_account: enikk-smoke
    role: connector
    connector: smoke

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 320Mi }

# PostSync check of the deployed core (ADR-0023 §2), as the enikk-smoke identity.
selfcheck:
  deadlineSeconds: 180
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 160Mi }

migration:
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 256Mi }
