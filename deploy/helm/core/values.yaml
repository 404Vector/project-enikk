image:
  repository: ghcr.io/404vector/enikk-core
  # Set by Argo CD Image Updater. While empty, the Deployment runs no replicas.
  tag: ""
  pullPolicy: IfNotPresent

port: 8000

# CloudNativePG application Secret (ADR-0011). Created by the operator, never by hand.
database:
  secret: enikk-db-app

# Credentials core hands out (ADR-0013). Written only by `enikk-ops secret sync`
# and mounted into core alone. Optional, so core starts before the first sync.
credentials:
  secret: enikk-core-credentials
  mountPath: /var/run/secrets/enikk/credentials

# GitHub App (ADR-0019). Public identifiers; the private key is the core-only
# credential github.app-private-key. selfRepository pins which entry of
# config/github.yaml is the platform itself.
github:
  # Strings: Helm renders large numbers in exponent form.
  appId: "5869950"
  installationId: "184545127"
  owner: 404Vector
  selfRepository: project-enikk

# Slack approval of pull requests (ADR-0020): core watches open PRs to main and
# asks the owner in a DM; approving records enikk/owner-approval and merges.
approval:
  enabled: true
  intervalSeconds: 30

# Wake the thread's session when its PR (checks, merge, deployment) or prompt
# candidate moves on, so the work carries on without the owner (ADR-0041 §4).
# false: the status card alone, as before.
wakeups:
  enabled: true

# Deployment and image build notices in the owner's DM (ADR-0023). core reads
# these Argo CD Applications (Role in argocdNamespace, get only).
deployments:
  enabled: true
  intervalSeconds: 30
  argocdNamespace: argocd
  apps:
    [enikk-core, enikk-runtime-claude, enikk-connector-slack, enikk-scheduler, enikk-agentgateway]
  timeoutSeconds: 600
  settleSeconds: 60

# Enikk's memory: the owner's Obsidian vault repository (ADR-0028). core indexes
# its notes and hands enikk's own (vault/Private/enikk/) to every task.
memory:
  enabled: true
  repository: vault.hyeongseok-kim
  intervalSeconds: 60

# Read-only diagnostics (ADR-0029): recent tasks, deployments, Pod logs of enikk's
# services and pull requests, answered by core with secrets masked.
diagnostics:
  enabled: true

# Prompt candidates and their promotion in Slack (ADR-0032). core writes to Langfuse
# with its own langfuse.public-key / langfuse.secret-key; the owner's Slack ID comes
# from config/slack.yaml. Without the keys the feature answers with an error.
prompts:
  enabled: true
  langfuseUrl: https://jp.cloud.langfuse.com

# ServiceAccounts allowed to call core, their roles (ADR-0011 §5) and the
# credentials each may fetch (ADR-0013). Any other ServiceAccount is rejected.
# Accounts live in deploy/k8s/identities.
roleBindings:
  - namespace: enikk
    service_account: enikk-connector-slack
    role: connector
    connector: slack
    credentials: [slack.bot-token, slack.app-token]
  - namespace: enikk
    service_account: enikk-runtime-claude
    role: runtime
    engine: claude
    credentials: [claude.oauth-token, langfuse.public-key, langfuse.secret-key]
  - namespace: enikk
    service_account: enikk-runtime-gemini
    role: runtime
    engine: gemini
  - namespace: enikk
    service_account: enikk-scheduler
    role: scheduler
  - namespace: enikk
    service_account: enikk-smoke
    role: connector
    connector: smoke

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 320Mi }

# PostSync check of the deployed core (ADR-0023 §2), as the enikk-smoke identity.
selfcheck:
  deadlineSeconds: 180
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 160Mi }

migration:
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 256Mi }
