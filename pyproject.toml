[project]
name = "project-enikk"
version = "0.1.0"
description = "Personal AI agent platform on Slack (uv workspace root)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.15",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/libs/*", "src/libs/adapters/*", "src/apps/*"]
exclude = ["src/libs/adapters"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["src"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "SIM", "RUF", "PT",
    "TC",   # type-checking-only imports
    "ANN",  # annotations everywhere; ANN401 forbids Any in signatures
    "TID",  # banned APIs, no relative imports
    "S",    # security
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# pydantic resolves field annotations at runtime, so their imports must stay outside
# TYPE_CHECKING blocks in subclasses of these bases.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "enikk_kernel.models.FrozenModel",
    "enikk_kernel.settings.SettingsModel",
    "enikk_kernel.settings.ServiceSettings",
    "enikk_contracts.base.Contract",
    "enikk_core_domain.model.Entity",
    "enikk_kernel.settings.SettingsModel",
    "sqlalchemy.orm.DeclarativeBase",
    "enikk_persistence_sql.tables.Base",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"json".msg = "Parse and serialize with pydantic models (docs/architecture/principles.md P-13)."
"subprocess".msg = "Run external commands through enikk_kernel.process.ProcessRunner."

[tool.ruff.lint.per-file-ignores]
"src/libs/kernel/enikk_kernel/process.py" = ["TID251", "S603"]
# Credential names, not values.
"src/libs/contracts/enikk_contracts/credentials.py" = ["S105"]
"src/**/tests/**" = ["S101", "S105", "S106", "TID251"]

[tool.ruff.lint.isort]
known-first-party = [
    "enikk_kernel",
    "enikk_contracts",
    "enikk_core_domain",
    "enikk_core_client",
    "enikk_persistence_sql",
    "enikk_k8s_auth",
    "enikk_github",
    "enikk_k8s_jobs",
    "enikk_platform",
    "enikk_runtime",
    "enikk_langfuse",
    "enikk_engine_claude",
    "enikk_core",
    "enikk_ops",
    "enikk_runtime_claude",
    "enikk_connector_slack",
    "enikk_scheduler",
    "enikk_imagegen",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = [
    "src/libs/kernel/enikk_kernel",
    "src/libs/contracts/enikk_contracts",
    "src/libs/core-domain/enikk_core_domain",
    "src/libs/core-client/enikk_core_client",
    "src/libs/adapters/persistence-sql/enikk_persistence_sql",
    "src/libs/adapters/k8s-auth/enikk_k8s_auth",
    "src/libs/adapters/github/enikk_github",
    "src/libs/adapters/github/tests",
    "src/libs/adapters/k8s-jobs/enikk_k8s_jobs",
    "src/libs/adapters/k8s-jobs/tests",
    "src/libs/adapters/platform/enikk_platform",
    "src/libs/runtime/enikk_runtime",
    "src/libs/runtime/tests",
    "src/libs/adapters/langfuse/enikk_langfuse",
    "src/libs/adapters/langfuse/tests",
    "src/libs/adapters/engine-claude/enikk_engine_claude",
    "src/libs/adapters/engine-claude/tests",
    "src/apps/core/enikk_core",
    "src/apps/core/tests",
    "src/apps/ops-cli/enikk_ops",
    "src/apps/runtime-claude/enikk_runtime_claude",
    "src/apps/runtime-claude/tests",
    "src/apps/connector-slack/enikk_connector_slack",
    "src/apps/connector-slack/tests",
    "src/apps/scheduler/enikk_scheduler",
    "src/apps/scheduler/tests",
    "src/apps/imagegen/enikk_imagegen",
    "src/apps/imagegen/tests",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- import-linter
# Dependency rules from docs/architecture/code-structure.md section 4.
[tool.importlinter]
root_packages = [
    "enikk_kernel",
    "enikk_contracts",
    "enikk_core_domain",
    "enikk_core_client",
    "enikk_persistence_sql",
    "enikk_k8s_auth",
    "enikk_github",
    "enikk_k8s_jobs",
    "enikk_platform",
    "enikk_runtime",
    "enikk_langfuse",
    "enikk_engine_claude",
    "enikk_core",
    "enikk_ops",
    "enikk_runtime_claude",
    "enikk_connector_slack",
    "enikk_scheduler",
    "enikk_imagegen",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "kernel depends on no other project package"
type = "forbidden"
source_modules = ["enikk_kernel"]
forbidden_modules = [
    "enikk_contracts", "enikk_core_domain", "enikk_core_client", "enikk_persistence_sql",
    "enikk_k8s_auth", "enikk_github", "enikk_k8s_jobs", "enikk_platform", "enikk_runtime", "enikk_langfuse", "enikk_engine_claude", "enikk_core", "enikk_ops", "enikk_runtime_claude", "enikk_connector_slack", "enikk_scheduler",
    "enikk_imagegen",
]

[[tool.importlinter.contracts]]
name = "contracts depend only on kernel"
type = "forbidden"
source_modules = ["enikk_contracts"]
forbidden_modules = [
    "enikk_core_domain", "enikk_core_client", "enikk_persistence_sql", "enikk_k8s_auth",
    "enikk_github", "enikk_k8s_jobs", "enikk_platform", "enikk_runtime", "enikk_langfuse", "enikk_engine_claude", "enikk_core", "enikk_ops", "enikk_runtime_claude", "enikk_connector_slack", "enikk_scheduler",
    "enikk_imagegen",
]

[[tool.importlinter.contracts]]
name = "core domain depends only on contracts and kernel"
type = "forbidden"
source_modules = ["enikk_core_domain"]
forbidden_modules = [
    "enikk_core_client", "enikk_persistence_sql", "enikk_k8s_auth", "enikk_github", "enikk_k8s_jobs", "enikk_platform",
    "enikk_runtime", "enikk_langfuse", "enikk_engine_claude", "enikk_core", "enikk_ops", "enikk_runtime_claude", "enikk_connector_slack",
    "enikk_scheduler", "enikk_imagegen",
    "fastapi", "starlette", "uvicorn", "httpx", "typer", "yaml", "sqlalchemy", "alembic", "psycopg",
]

[[tool.importlinter.contracts]]
name = "core client depends only on contracts and kernel"
type = "forbidden"
source_modules = ["enikk_core_client"]
forbidden_modules = [
    "enikk_core_domain", "enikk_persistence_sql", "enikk_k8s_auth", "enikk_github", "enikk_k8s_jobs", "enikk_platform",
    "enikk_runtime", "enikk_langfuse", "enikk_engine_claude", "enikk_core", "enikk_ops", "enikk_runtime_claude", "enikk_connector_slack", "enikk_scheduler",
    "enikk_imagegen",
]

[[tool.importlinter.contracts]]
name = "runtime framework depends only on kernel, contracts and core client"
type = "forbidden"
source_modules = ["enikk_runtime"]
forbidden_modules = [
    "enikk_core_domain", "enikk_persistence_sql", "enikk_k8s_auth", "enikk_github", "enikk_k8s_jobs", "enikk_platform",
    "enikk_langfuse", "enikk_engine_claude", "enikk_core", "enikk_ops", "enikk_runtime_claude", "enikk_connector_slack",
    "enikk_scheduler", "enikk_imagegen",
    "fastapi", "starlette", "uvicorn", "typer", "yaml", "sqlalchemy", "alembic", "psycopg",
]

[[tool.importlinter.contracts]]
name = "libraries never import apps"
type = "forbidden"
source_modules = [
    "enikk_kernel", "enikk_contracts", "enikk_core_domain", "enikk_core_client",
    "enikk_persistence_sql", "enikk_k8s_auth", "enikk_github", "enikk_k8s_jobs", "enikk_platform", "enikk_runtime",
    "enikk_langfuse", "enikk_engine_claude",
]
forbidden_modules = [
    "enikk_core", "enikk_ops", "enikk_runtime_claude", "enikk_connector_slack", "enikk_scheduler",
    "enikk_imagegen",
]

[[tool.importlinter.contracts]]
name = "adapters do not import each other"
type = "independence"
modules = [
    "enikk_persistence_sql", "enikk_k8s_auth", "enikk_github", "enikk_k8s_jobs", "enikk_platform", "enikk_langfuse",
    "enikk_engine_claude",
]

[[tool.importlinter.contracts]]
name = "database libraries only in persistence-sql (I-26)"
type = "forbidden"
source_modules = [
    "enikk_kernel", "enikk_contracts", "enikk_core_domain", "enikk_core_client", "enikk_k8s_auth",
    "enikk_github", "enikk_k8s_jobs", "enikk_platform", "enikk_runtime", "enikk_langfuse", "enikk_engine_claude", "enikk_core", "enikk_ops", "enikk_runtime_claude", "enikk_connector_slack", "enikk_scheduler",
    "enikk_imagegen",
]
forbidden_modules = ["sqlalchemy", "alembic", "psycopg"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "apps are independent of each other"
type = "independence"
modules = [
    "enikk_core", "enikk_ops", "enikk_runtime_claude", "enikk_connector_slack", "enikk_scheduler",
    "enikk_imagegen",
]

[[tool.importlinter.contracts]]
name = "kernel and contracts import no frameworks or SDKs"
type = "forbidden"
source_modules = ["enikk_kernel", "enikk_contracts"]
forbidden_modules = ["fastapi", "starlette", "uvicorn", "httpx", "typer", "yaml"]

[[tool.importlinter.contracts]]
name = "platform domain and ports never import platform adapters"
type = "forbidden"
source_modules = ["enikk_platform.domain", "enikk_platform.ports"]
forbidden_modules = ["enikk_platform.adapters"]

[[tool.importlinter.contracts]]
name = "Claude Agent SDK only in engine-claude (I-08)"
type = "forbidden"
source_modules = [
    "enikk_kernel", "enikk_contracts", "enikk_core_domain", "enikk_core_client",
    "enikk_persistence_sql", "enikk_k8s_auth", "enikk_github", "enikk_k8s_jobs", "enikk_platform", "enikk_runtime",
    "enikk_langfuse", "enikk_core", "enikk_ops", "enikk_runtime_claude", "enikk_connector_slack", "enikk_scheduler",
    "enikk_imagegen",
]
forbidden_modules = ["claude_agent_sdk"]
# The runtime app assembles engine-claude; only direct SDK imports are forbidden.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Slack SDK only in connector-slack"
type = "forbidden"
source_modules = [
    "enikk_kernel", "enikk_contracts", "enikk_core_domain", "enikk_core_client",
    "enikk_persistence_sql", "enikk_k8s_auth", "enikk_github", "enikk_k8s_jobs", "enikk_platform", "enikk_runtime",
    "enikk_langfuse", "enikk_engine_claude", "enikk_core", "enikk_ops", "enikk_runtime_claude",
    "enikk_scheduler",
    "enikk_imagegen",
]
forbidden_modules = ["slack_sdk", "aiohttp"]

[[tool.importlinter.contracts]]
name = "GitHub App adapter only in core (I-32)"
type = "forbidden"
source_modules = [
    "enikk_kernel", "enikk_contracts", "enikk_core_domain", "enikk_core_client",
    "enikk_persistence_sql", "enikk_k8s_auth", "enikk_platform", "enikk_runtime",
    "enikk_langfuse", "enikk_engine_claude", "enikk_ops", "enikk_runtime_claude",
    "enikk_connector_slack",
    "enikk_scheduler",
    "enikk_imagegen",
]
forbidden_modules = ["enikk_github"]

[[tool.importlinter.contracts]]
name = "JWT signing only in the GitHub adapter (I-32)"
type = "forbidden"
source_modules = [
    "enikk_kernel", "enikk_contracts", "enikk_core_domain", "enikk_core_client",
    "enikk_persistence_sql", "enikk_k8s_auth", "enikk_platform", "enikk_runtime",
    "enikk_langfuse", "enikk_engine_claude", "enikk_core", "enikk_ops", "enikk_runtime_claude",
    "enikk_connector_slack",
    "enikk_scheduler",
    "enikk_imagegen",
]
forbidden_modules = ["jwt"]
# The Claude Agent SDK depends on PyJWT; only direct imports are forbidden.
allow_indirect_imports = true
