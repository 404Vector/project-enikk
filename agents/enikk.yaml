name: enikk
# Former name: threads started before ADR-0037 5b are recorded as "assistant".
aliases: [assistant]
description: Enikk, the owner's agent, in direct Slack conversations
engine: claude
# The base prompt of every enikk session (ADR-0037 §1).
prompt:
  name: enikk
  label: production
tools:
  # MCP servers through agentgateway (ADR-0039 §2, I-05). Core's token for the task
  # names exactly these tools; the gateway shows and allows no others.
  mcp:
    - server: scheduler
      allow:
        [list_schedules, get_schedule, list_runs, create_schedule, update_schedule,
         pause_schedule, resume_schedule, delete_schedule, run_now]
  # SDK built-in tools, run in the engine's Landlock sandbox (ADR-0033, I-14). What the
  # web returns is untrusted input. No browser automation.
  builtin:
    [Read, Write, Edit, NotebookEdit, Glob, Grep, Bash, Monitor, TaskStop,
     WebSearch, WebFetch, TaskCreate, TaskGet, TaskList, TaskUpdate, Task]
  # Create prompt candidates through core; only the owner promotes them (ADR-0032, I-36).
  # Make one day's conversation summary again when the owner asks (ADR-0035).
  # A short-lived GitHub token in the shell: push the thread's agent branch, open and
  # close pull requests (ADR-0041 §1).
  platform: [prompt-candidates, conversation-digest, github]
# Room for development work in the thread's own session (ADR-0037 4a).
limits:
  max_turns: 100
  timeout_seconds: 3600
