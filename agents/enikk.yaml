name: enikk
# Former name: threads started before ADR-0037 5b are recorded as "assistant".
aliases: [assistant]
description: Enikk, the owner's agent, in direct Slack conversations
engine: claude
# The base prompt of every enikk session (ADR-0037 §1).
prompt:
  name: enikk
  label: production
tools:
  # MCP servers through agentgateway (ADR-0039 §2, I-05). Core's token for the task
  # names exactly these tools; the gateway shows and allows no others.
  mcp:
    - server: scheduler
      allow:
        [list_schedules, get_schedule, list_runs, create_schedule, update_schedule,
         pause_schedule, resume_schedule, delete_schedule, run_now]
    # Images with the Gemini API, saved to the thread's tmp (ADR-0043).
    - server: imagegen
      allow:
        [generate_image, edit_image, list_styles, add_style_reference,
         remove_style_reference]
    # The owner's Unity editor on the Windows PC, through the relay (ADR-0044). Every
    # tool of MCP for Unity 10.3.0; they can change the project and run code there.
    - server: unity
      allow:
        [apply_text_edits, batch_execute, blender_bridge, create_script,
         debug_request_context, delete_script, execute_code, execute_menu_item,
         find_gameobjects, find_in_file, generate_audio, generate_image,
         generate_model, get_sha, get_test_job, import_model, import_model_file,
         manage_animation, manage_asset, manage_build, manage_camera,
         manage_components, manage_editor, manage_gameobject, manage_graphics,
         manage_material, manage_packages, manage_physics, manage_prefabs,
         manage_probuilder, manage_profiler, manage_scene, manage_script,
         manage_script_capabilities, manage_scriptable_object, manage_shader,
         manage_texture, manage_tools, manage_ui, manage_vfx, read_console,
         refresh_unity, run_tests, script_apply_edits, set_active_instance, unity_docs,
         unity_reflect, validate_script, list_unity_resources, read_unity_resource]
  # SDK built-in tools, run in the engine's Landlock sandbox (ADR-0033, I-14). What the
  # web returns is untrusted input. No browser automation.
  builtin:
    [Read, Write, Edit, NotebookEdit, Glob, Grep, Bash, Monitor, TaskStop,
     WebSearch, WebFetch, TaskCreate, TaskGet, TaskList, TaskUpdate, Task]
  # Create prompt candidates through core; only the owner promotes them (ADR-0032, I-36).
  # A short-lived GitHub token in the shell: push the thread's agent branch, open and
  # close pull requests (ADR-0041 §1).
  platform: [prompt-candidates, github]
# Agents enikk may hand work to with the delegate tool; their results come back to the
# thread as an [이벤트] task (ADR-0047).
delegates: [rita]
# Room for development work in the thread's own session (ADR-0037 4a).
limits:
  max_turns: 100
  timeout_seconds: 3600
