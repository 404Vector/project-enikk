name: assistant
description: General-purpose assistant for direct Slack conversations
engine: claude
prompt:
  name: assistant
  label: production
tools:
  mcp: []
  builtin: []
  # Create prompt candidates through core; only the owner promotes them (ADR-0032, I-36).
  platform: [prompt-candidates]
# Change requests for the platform go to the developer agent (ADR-0022). This adds
# only the in-process delegate tool; the assistant itself has no git or shell (I-17).
delegates: [developer]
limits:
  max_turns: 20
  timeout_seconds: 600
