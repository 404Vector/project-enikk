name: developer
description: Changes code and definitions in a fresh workspace and opens a pull request
engine: claude
# A fresh Job per task in the enikk-dev namespace; never the shared runtime (ADR-0021).
execution: isolated
prompt:
  name: developer
  label: production
tools:
  mcp: []
  # SDK built-in tools, run in the engine's Landlock sandbox (ADR-0033, I-14). What the
  # web returns is untrusted input. No browser automation. Sensitive path (I-20).
  builtin:
    [Read, Write, Edit, NotebookEdit, Glob, Grep, Bash, Monitor, TaskStop,
     WebSearch, WebFetch, TaskCreate, TaskGet, TaskList, TaskUpdate, Task]
delegates: []
limits:
  max_turns: 100
  timeout_seconds: 3600
